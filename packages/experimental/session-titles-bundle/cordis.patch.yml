- id: session-title-llm
  disabled: true

- insert:
    - id: optional-session-title-all-prompts
      name: '@deepseek-ai/dsh-session-title-all-prompts-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        # A ceiling against runaway output, not a length target: the prompt
        # keeps titles short, while reasoning a model cannot switch off also
        # counts as output. 64 tokens starved reasoning models, whose whole
        # budget went to reasoning and left no title text (the session stayed
        # on its fallback name).
        maxOutputTokens: 4096
        timeoutMs: 60000
